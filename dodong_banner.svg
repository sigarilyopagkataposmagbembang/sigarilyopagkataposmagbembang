<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Animated underground neon green cyber banner for DODONG">
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#050705"/><stop offset=".55" stop-color="#101710"/><stop offset="1" stop-color="#030403"/></linearGradient>
    <radialGradient id="greenGlow"><stop stop-color="#a8ff00" stop-opacity=".48"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></radialGradient>
    <linearGradient id="chrome" x2="0" y2="1"><stop stop-color="#f4ffe7"/><stop offset=".22" stop-color="#8e9b83"/><stop offset=".48" stop-color="#ffffff"/><stop offset=".7" stop-color="#4c5948"/><stop offset="1" stop-color="#d7e4c9"/></linearGradient>
    <linearGradient id="acid" x2="1" y2="1"><stop stop-color="#d5ff00"/><stop offset=".5" stop-color="#65ff00"/><stop offset="1" stop-color="#18a800"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#7cff00" stroke-opacity=".12" stroke-width="1"/></pattern>
    <pattern id="scan" width="3" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H3" stroke="#fff" stroke-opacity=".06"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="clip"><rect width="900" height="250" rx="5"/></clipPath>
    <g id="cube" stroke="#a6ff00" stroke-width="1.5" fill="#7cff00" fill-opacity=".08"><path d="M0 -18 17 -9 17 10 0 19 -17 10 -17 -9Z"/><path d="M0 -18V1L17 -9M0 1L-17 -9M0 1V19" fill="none"/><path d="M-17 -9 0 0 17 -9" fill="none" opacity=".7"/></g>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="250" fill="url(#bg)"/>
    <rect width="900" height="250" fill="url(#grid)"/>
    <ellipse cx="455" cy="132" rx="330" ry="150" fill="url(#greenGlow)" filter="url(#soft)"><animate attributeName="opacity" values=".45;.9;.45" dur="3.8s" repeatCount="indefinite"/></ellipse>
    <!-- distant industrial skyline -->
    <g fill="#0b160a" stroke="#4cff00" stroke-opacity=".23">
      <path d="M0 177V130H40V151H72V111H115V165H153V138H196V179ZM900 177V122H862V145H827V104H790V166H748V131H706V179Z"/>
      <path d="M0 193 90 174 160 190 248 166 330 190 410 174 500 192 590 168 670 190 760 172 900 194V250H0Z" fill="#071007"/>
    </g>
    <g fill="#9cff00" opacity=".55"><path d="M82 143h4v8h-4zm16-13h4v8h-4zm55 21h4v8h-4zm-116-8h4v8h-4zm687 1h4v8h-4zm39-18h4v8h-4zm52 27h4v8h-4z"/></g>
    <!-- drifting haze -->
    <g fill="#73ff00" opacity=".13" filter="url(#soft)"><ellipse cx="170" cy="188" rx="180" ry="18"><animate attributeName="cx" values="170;340;170" dur="18s" repeatCount="indefinite"/></ellipse><ellipse cx="740" cy="204" rx="190" ry="16"><animate attributeName="cx" values="740;560;740" dur="15s" repeatCount="indefinite"/></ellipse></g>
    <!-- floating cubes -->
    <g><use href="#cube" x="145" y="83"><animateTransform attributeName="transform" type="translate" values="0 0;8 -14;0 0" dur="5s" repeatCount="indefinite"/></use><animateTransform attributeName="transform" type="rotate" values="0 145 83;360 145 83" dur="18s" repeatCount="indefinite"/></g>
    <g><use href="#cube" x="755" y="88" transform="scale(1.35)"><animateTransform attributeName="transform" type="rotate" values="0 755 88;360 755 88" dur="22s" repeatCount="indefinite"/></use></g>
    <g><use href="#cube" x="255" y="190" transform="scale(.65)"><animateTransform attributeName="transform" type="rotate" values="0 255 190;-360 255 190" dur="13s" repeatCount="indefinite"/></use></g>
    <g><use href="#cube" x="665" y="190" transform="scale(.8)"><animateTransform attributeName="transform" type="rotate" values="0 665 190;360 665 190" dur="16s" repeatCount="indefinite"/></use></g>
    <!-- orbital rings -->
    <g fill="none" stroke="#7dff00" stroke-opacity=".55"><ellipse cx="450" cy="128" rx="260" ry="67" transform="rotate(-12 450 128)" stroke-dasharray="3 12"><animateTransform attributeName="transform" type="rotate" from="-12 450 128" to="348 450 128" dur="36s" repeatCount="indefinite"/></ellipse><ellipse cx="450" cy="128" rx="300" ry="88" transform="rotate(16 450 128)" stroke-opacity=".22" stroke-dasharray="1 18"><animateTransform attributeName="transform" type="rotate" from="16 450 128" to="-344 450 128" dur="48s" repeatCount="indefinite"/></ellipse></g>
    <!-- fast laser streaks -->
    <g stroke="#b5ff00" stroke-width="2" opacity="0"><path d="M-80 75H140"><animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;980 0" dur="2.8s" repeatCount="indefinite"/></path><path d="M-130 164H40"><animate attributeName="opacity" values="0;1;0" begin="1.1s" dur="3.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;1080 0" begin="1.1s" dur="3.3s" repeatCount="indefinite"/></path></g>
    <!-- top HUD -->
    <g font-family="monospace" font-size="10" letter-spacing="2" fill="#a8ff00"><text x="28" y="29">2093 // UNDERGROUND SIGNAL</text><text x="872" y="29" text-anchor="end">LYFE MODE : ON</text><text x="28" y="224" opacity=".7">NO SLEEP  /  ALL GAS</text><text x="872" y="224" text-anchor="end" opacity=".7">2093.EXE</text></g>
    <path d="M28 39H872M28 210H872" stroke="#7dff00" stroke-opacity=".25" stroke-width="1"/>
    <!-- centerpiece glitch shadows -->
    <g font-family="Arial Black,Impact,sans-serif" font-weight="900" text-anchor="middle">
      <text x="454" y="139" font-size="86" letter-spacing="7" fill="#a6ff00" opacity=".65" transform="translate(4 0)"><animate attributeName="opacity" values=".1;.7;.1;0;.5" dur="3.1s" repeatCount="indefinite"/>DODONG</text>
      <text x="446" y="139" font-size="86" letter-spacing="7" fill="#19ff00" opacity=".55" transform="translate(-3 0)"><animate attributeName="opacity" values=".5;0;.6;.2;.5" dur="2.4s" repeatCount="indefinite"/>DODONG</text>
      <text x="450" y="136" font-size="86" letter-spacing="7" fill="url(#chrome)" stroke="#d6ffb0" stroke-width=".7" filter="url(#glow)">DODONG</text>
      <text x="450" y="136" font-size="86" letter-spacing="7" fill="url(#chrome)" opacity=".35"><animate attributeName="y" values="136;133;136" dur="2.2s" repeatCount="indefinite"/>DODONG</text>
    </g>
    <!-- subtitle and equalizer -->
    <text x="450" y="163" text-anchor="middle" fill="#a6ff00" font-family="monospace" font-size="11" letter-spacing="6">VIBE CODE // 2093</text>
    <g transform="translate(390 184)" fill="url(#acid)" filter="url(#glow)"><rect x="0" y="4" width="4" height="12"><animate attributeName="height" values="5;17;8;14;5" dur=".7s" repeatCount="indefinite"/><animate attributeName="y" values="11; -1;8;2;11" dur=".7s" repeatCount="indefinite"/></rect><rect x="12" y="0" width="4" height="17"><animate attributeName="height" values="17;6;13;4;17" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="0;11;4;13;0" dur=".9s" repeatCount="indefinite"/></rect><rect x="24" y="3" width="4" height="14"><animate attributeName="height" values="14;4;17;8;14" dur=".6s" repeatCount="indefinite"/><animate attributeName="y" values="3;13;0;9;3" dur=".6s" repeatCount="indefinite"/></rect><rect x="36" y="1" width="4" height="16"><animate attributeName="height" values="16;8;4;14;16" dur=".8s" repeatCount="indefinite"/><animate attributeName="y" values="1;9;13;3;1" dur=".8s" repeatCount="indefinite"/></rect><rect x="48" y="5" width="4" height="12"><animate attributeName="height" values="12;17;6;10;12" dur=".65s" repeatCount="indefinite"/><animate attributeName="y" values="5;0;11;7;5" dur=".65s" repeatCount="indefinite"/></rect><rect x="60" y="0" width="4" height="17"><animate attributeName="height" values="17;5;13;8;17" dur=".75s" repeatCount="indefinite"/><animate attributeName="y" values="0;12;4;9;0" dur=".75s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(510 184)" fill="url(#acid)" filter="url(#glow)"><rect x="0" y="4" width="4" height="12"><animate attributeName="height" values="5;17;8;14;5" dur=".7s" repeatCount="indefinite"/><animate attributeName="y" values="11; -1;8;2;11" dur=".7s" repeatCount="indefinite"/></rect><rect x="12" y="0" width="4" height="17"><animate attributeName="height" values="17;6;13;4;17" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="0;11;4;13;0" dur=".9s" repeatCount="indefinite"/></rect><rect x="24" y="3" width="4" height="14"><animate attributeName="height" values="14;4;17;8;14" dur=".6s" repeatCount="indefinite"/><animate attributeName="y" values="3;13;0;9;3" dur=".6s" repeatCount="indefinite"/></rect><rect x="36" y="1" width="4" height="16"><animate attributeName="height" values="16;8;4;14;16" dur=".8s" repeatCount="indefinite"/><animate attributeName="y" values="1;9;13;3;1" dur=".8s" repeatCount="indefinite"/></rect><rect x="48" y="5" width="4" height="12"><animate attributeName="height" values="12;17;6;10;12" dur=".65s" repeatCount="indefinite"/><animate attributeName="y" values="5;0;11;7;5" dur=".65s" repeatCount="indefinite"/></rect><rect x="60" y="0" width="4" height="17"><animate attributeName="height" values="17;5;13;8;17" dur=".75s" repeatCount="indefinite"/><animate attributeName="y" values="0;12;4;9;0" dur=".75s" repeatCount="indefinite"/></rect></g>
    <!-- intermittent glitch bars -->
    <g opacity="0"><rect x="170" y="102" width="560" height="3" fill="#d5ff00"><animate attributeName="opacity" values="0;0;1;0;0" dur="4.2s" repeatCount="indefinite"/></rect><rect x="235" y="147" width="430" height="2" fill="#fff"><animate attributeName="opacity" values="0;0;0;.7;0" begin="1.3s" dur="3.7s" repeatCount="indefinite"/></rect><rect x="320" y="119" width="260" height="4" fill="#38ff00"><animate attributeName="opacity" values="0;1;0;0" begin="2s" dur="3.2s" repeatCount="indefinite"/></rect></g>
    <rect width="900" height="250" fill="url(#scan)" pointer-events="none"/>
    <rect x="1.5" y="1.5" width="897" height="247" rx="4" fill="none" stroke="#a6ff00" stroke-opacity=".6"/>
    <g fill="#b7ff00"><path d="M16 16h18v2H18v16h-2zm868 0h-18v2h16v16h2zM16 234h18v-2H18v-16h-2zm868 0h-18v-2h16v-16h2z"/></g>
  </g>
</svg>
